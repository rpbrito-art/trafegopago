name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install / lint / typecheck / functions / test / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Edge Functions rodam em Deno, fora do tsconfig da aplicação: usam
      # specifier `npm:` e import com extensão `.ts`. Sem este passo o único
      # gate delas seria o bundle do deploy — que já deixou passar um erro de
      # tipo que o `deno check` pegou na Correção 002B-01.
      - name: Typecheck Edge Functions
        run: npm run typecheck:functions

      - name: Test
        run: npm test

      # O build não depende de credenciais Supabase: a leitura de env é feita
      # em runtime, dentro das funções de criação de cliente. Nenhum secret é
      # necessário para esta validação estrutural.
      - name: Build
        run: npm run build
